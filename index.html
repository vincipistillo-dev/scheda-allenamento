<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0E0C0A">
<meta name="description" content="Diario di carichi, serie e progressioni">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Scheda">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" type="image/png" href="./icon-192.png">
<title>Scheda di Allenamento</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Archivo:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root{
    /* dark-first: base look, sampled from the Vitruvian app's near-black + dusty terracotta */
    --ground:#0E0C0A;
    --surface:#18140F;
    --surface-2:#221C15;
    --ink:#EEE8E0;
    --ink-muted:#A79C8E;
    --ink-faint:#6E6459;
    --line:#2B241C;
    --line-strong:#3D3327;
    --accent:#CC9A78;
    --accent-ink:#241407;
    --accent-soft:#3A2712;
    --steel:#8FADC7;
    --steel-soft:#1F2A33;
    --good:#8FBE78;
    --good-soft:#1F2A17;
    --warn:#D6AA46;
    --warn-soft:#2E2410;
    --shadow:0 1px 2px rgba(0,0,0,.5), 0 8px 22px rgba(0,0,0,.4);
    --font-display:'Big Shoulders Display','Arial Narrow',sans-serif;
    --font-body:'Archivo','Segoe UI',sans-serif;
    --font-mono:'IBM Plex Mono','Consolas',monospace;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --ground:#F3EEE6;
      --surface:#FAF7F2;
      --surface-2:#FFFFFF;
      --ink:#241A10;
      --ink-muted:#7B6C5C;
      --ink-faint:#A99B8A;
      --line:#E5DACA;
      --line-strong:#D3C3AC;
      --accent:#A8663E;
      --accent-ink:#FFFFFF;
      --accent-soft:#EFDCC7;
      --steel:#3E5972;
      --steel-soft:#DCE4EA;
      --good:#3F6A34;
      --good-soft:#DEE9D7;
      --warn:#8C6A18;
      --warn-soft:#F1E4C7;
      --shadow:0 1px 2px rgba(36,26,16,.07), 0 6px 16px rgba(36,26,16,.06);
    }
  }
  :root[data-theme="light"]{
    --ground:#F3EEE6;
    --surface:#FAF7F2;
    --surface-2:#FFFFFF;
    --ink:#241A10;
    --ink-muted:#7B6C5C;
    --ink-faint:#A99B8A;
    --line:#E5DACA;
    --line-strong:#D3C3AC;
    --accent:#A8663E;
    --accent-ink:#FFFFFF;
    --accent-soft:#EFDCC7;
    --steel:#3E5972;
    --steel-soft:#DCE4EA;
    --good:#3F6A34;
    --good-soft:#DEE9D7;
    --warn:#8C6A18;
    --warn-soft:#F1E4C7;
    --shadow:0 1px 2px rgba(36,26,16,.07), 0 6px 16px rgba(36,26,16,.06);
  }

  *{ box-sizing:border-box; }
  /* senza questa, un display:flex/grid batte l'attributo hidden e l'elemento resta a schermo */
  [hidden]{ display:none !important; }
  /* consente lo scorrimento ma non il pizzico per zoomare né il doppio tocco */
  /* light dark = anche i controlli nativi (tastierini, barre) seguono il tema di sistema */
  html{ touch-action:pan-x pan-y; -webkit-text-size-adjust:100%; color-scheme:light dark; overscroll-behavior:none; }
  body{ overscroll-behavior:none; }
  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:15px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }

  /* spazio in fondo perché il cronometro non copra l'ultimo pulsante */
  .shell{ max-width:820px; margin:0 auto; padding:max(6px, env(safe-area-inset-top)) 20px 32px; }
  body.in-scheda .shell{ padding-bottom:88px; }

  header.top{ padding-bottom:0; margin-bottom:14px; }
  /* testata: data e nome dell'app centrati, comandi appoggiati a destra sulla stessa fascia */
  .intestazione-app{
    position:relative; text-align:center;
    padding:0 0 10px; margin-bottom:12px; border-bottom:1px solid var(--line);
  }
  .nome-app{
    display:block; margin-top:3px;
    font-family:var(--font-display); font-weight:800; font-size:21px;
    letter-spacing:.01em; color:var(--ink);
  }
  .intestazione-app .azioni-top{
    position:absolute; right:0; top:50%; transform:translateY(-50%);
  }
  .riga-titolo{ display:flex; align-items:flex-end; justify-content:space-between; gap:16px; }
  .brand h1{
    font-family:var(--font-display); font-weight:800; font-size:40px;
    letter-spacing:.2px; margin:0; line-height:.9; text-wrap:balance;
  }
  .brand p{ margin:6px 0 0; color:var(--ink-muted); font-size:13.5px; }
  .oggi{
    display:block;
    font-family:var(--font-mono); font-size:10.5px; font-weight:600;
    letter-spacing:.12em; text-transform:uppercase; color:var(--accent);
  }

  /* home: l'elenco delle schede */
  .schede-elenco{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; }
  .scheda-carta{
    display:flex; flex-direction:column; gap:3px; cursor:pointer;
    transition:transform .12s ease, border-color .15s ease;
    background:
      radial-gradient(120% 140% at 0% 0%, var(--accent-soft) 0%, transparent 60%),
      var(--surface);
    border:1px solid var(--line); border-radius:18px; padding:12px 14px;
    box-shadow:var(--shadow);
  }
  .scheda-carta:hover{ border-color:var(--line-strong); }
  .scheda-carta:active{ transform:scale(.988); }
  .scheda-alto{ display:flex; align-items:center; gap:8px; }
  .scheda-icona{
    display:inline-flex; align-items:center; justify-content:center;
    width:42px; height:42px; border-radius:14px;
    background:var(--accent-soft); color:var(--accent);
  }
  .scheda-icona .ico{ width:20px; height:20px; opacity:1; }
  .scheda-nome{ font-family:var(--font-display); font-weight:800; font-size:21px; line-height:1.15; flex:1 1 auto; min-width:0; }
  .scheda-dati{ font-size:12.5px; color:var(--ink-muted); }
  .scheda-azioni{ display:flex; gap:4px; flex:none; }
  /* dati in riquadrini appena accennati, con icona */
  .dati-riquadri{ display:flex; gap:6px; flex-wrap:wrap; margin-top:8px; }
  .dato{
    display:inline-flex; align-items:center; gap:5px;
    padding:5px 9px; border-radius:10px;
    background:var(--surface-2); border:1px solid var(--line);
    font-size:11.5px; color:var(--ink-muted); white-space:nowrap;
  }
  .dato-ico{ display:inline-flex; color:var(--ink-faint); }
  .dato-ico .ico{ width:13px; height:13px; opacity:1; }
  .pillola{
    display:inline-flex; align-items:center; gap:7px; align-self:flex-start;
    padding:6px 12px; border-radius:99px; margin-top:4px;
    background:var(--surface-2); border:1px solid var(--line);
    font-size:11.5px; color:var(--ink-muted);
  }
  .pillola .ico{ width:13px; height:13px; }
  .azioni-top{ display:flex; gap:4px; flex:none; }
  /* simbolo del peso: segna a destra il contesto "allenamento" */
  .simbolo-peso{ margin-left:auto; display:inline-flex; color:var(--ink-faint); }
  .simbolo-peso .ico{ width:19px; height:19px; }
  #titolo{ display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  #titolo .btn-icona{ width:26px; height:26px; }

  /* impostazioni sopra al resto, con la pagina sfocata dietro */
  .velo{
    position:fixed; inset:0; z-index:90; display:flex; align-items:center; justify-content:center; padding:20px;
    background:rgba(0,0,0,.45); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
    animation:velo-entra .18s ease-out;
  }
  @keyframes velo-entra{ from{ opacity:0 } to{ opacity:1 } }
  body.bloccato{ overflow:hidden; }
  .foglio{
    width:100%; max-width:330px; max-height:76vh; overflow-y:auto;
    background:var(--surface); border:1px solid var(--line-strong);
    border-radius:24px; padding:16px;
    box-shadow:0 12px 44px rgba(0,0,0,.5);
    animation:foglio-sale .2s cubic-bezier(.22,.9,.3,1);
  }
  @keyframes foglio-sale{ from{ transform:scale(.94); opacity:0 } to{ transform:none; opacity:1 } }
  .foglio-testa{ display:flex; align-items:center; justify-content:space-between; margin-bottom:14px; }
  .foglio-titolo{ font-family:var(--font-display); font-weight:800; font-size:19px; }
  .foglio-corpo{ display:flex; flex-direction:column; align-items:flex-start; gap:8px; }
  .foglio-corpo .eyebrow{ margin-top:8px; }
  .foglio-corpo form{ width:100%; }
  .nota-foglio{ margin:0; font-size:12.5px; color:var(--ink-muted); }
  .area-import{
    width:100%; margin-top:6px; padding:10px 12px; border-radius:14px; resize:vertical;
    background:var(--surface-2); border:1px solid var(--line-strong); color:var(--ink);
    font-family:var(--font-mono); font-size:13px; line-height:1.5;
  }
  .foglio-azioni{ display:flex; gap:8px; margin-top:10px; }
  @media (prefers-reduced-motion: reduce){
    .velo, .foglio{ animation:none; }
  }

  /* settimana: giorni come pastiglie, oggi in pieno, allenati con il punto sotto */
  .blocco-settimana{
    margin-top:16px; padding:14px 14px 12px;
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
  }
  .settimana-testa{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
  .settimana-testa .eyebrow{ margin-bottom:0; }
  .settimana-conto{ font-size:11.5px; color:var(--ink-muted); }
  .settimana{ display:grid; grid-template-columns:repeat(7,1fr); gap:4px; }
  .giorno-cella{
    display:flex; flex-direction:column; align-items:center; gap:5px;
    padding:2px 0 8px; border-radius:16px; position:relative;
    transition:background .18s ease;
  }
  .giorno-lettera{
    font-family:var(--font-mono); font-size:10px; letter-spacing:.06em;
    text-transform:uppercase; color:var(--ink-faint);
  }
  .giorno-numero{
    display:flex; align-items:center; justify-content:center;
    width:32px; height:32px; border-radius:50%;
    font-family:var(--font-mono); font-size:14px; font-weight:600; color:var(--ink-muted);
    transition:background .18s ease, color .18s ease;
  }
  /* il punto segnala l'allenamento anche a chi non distingue bene i colori */
  .giorno-cella.allenato::after{
    content:""; position:absolute; bottom:2px;
    width:5px; height:5px; border-radius:50%; background:var(--accent);
  }
  .giorno-cella.allenato .giorno-numero{ background:var(--accent-soft); color:var(--accent); }
  .giorno-cella.oggi .giorno-numero{ background:var(--accent); color:var(--accent-ink); }
  .giorno-cella.oggi.allenato::after{ background:var(--accent); }
  /* tema: comando segmentato a sole icone */
  .scelta-tema{ display:inline-flex; gap:2px; padding:3px; border-radius:99px; background:var(--surface-2); border:1px solid var(--line); }
  .tema-btn{
    display:inline-flex; align-items:center; justify-content:center;
    width:58px; height:44px; border-radius:99px; cursor:pointer;
    background:transparent; border:none; color:var(--ink-faint);
    transition:background .15s ease, color .15s ease;
  }
  .tema-btn:hover{ color:var(--ink); }
  .tema-btn .ico{ width:21px; height:21px; opacity:1; }
  .tema-btn.attiva{ background:var(--accent); color:var(--accent-ink); }
  .chip{
    padding:7px 14px; border-radius:99px; cursor:pointer;
    background:transparent; border:1px solid var(--line-strong); color:var(--ink-muted);
    font-family:var(--font-body); font-size:12.5px; font-weight:600;
  }
  .chip:hover{ color:var(--ink); border-color:var(--ink-faint); }
  .chip.attiva{ background:var(--accent-soft); border-color:var(--accent); color:var(--accent); }
  .avviso{ border-style:solid; border-color:var(--accent); color:var(--ink); margin-bottom:12px; }
  .scheda-conferma{ margin-bottom:12px; justify-content:flex-start; }
  .scheda-rinomina{ margin-bottom:0; }

  .day-tabs{
    display:flex; gap:8px; overflow-x:auto; padding:4px 4px 8px; margin-bottom:18px;
    scrollbar-width:none; -ms-overflow-style:none;   /* si scorre, ma senza barra a vista */
  }
  .day-tabs::-webkit-scrollbar{ display:none; }
  .day-tab{
    font-family:var(--font-display); font-weight:700; font-size:18px; letter-spacing:.2px;
    padding:9px 20px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--ink-muted); cursor:pointer;
    flex:none;
  }
  .day-tab:hover{ color:var(--ink); border-color:var(--line-strong); }
  .day-tab.active{ color:var(--accent-ink); background:var(--accent); border-color:var(--accent); }
  .day-tab-add{
    font-family:var(--font-body); font-weight:600; font-size:14px; color:var(--ink-muted);
    background:transparent; border:1px dashed var(--line-strong); border-radius:999px;
    padding:9px 18px; cursor:pointer; flex:none; align-self:center;
  }
  .day-tab-add:hover{ color:var(--accent); border-color:var(--accent); }

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    font-family:var(--font-body); font-weight:600; font-size:13.5px; cursor:pointer;
    border-radius:11px; padding:9px 14px; border:1px solid var(--line-strong);
    background:var(--surface-2); color:var(--ink);
  }
  .ico{ flex:none; opacity:.85; }
  .btn:hover{ border-color:var(--ink-faint); }
  .btn.primary{
    background:var(--accent); color:var(--accent-ink); border-color:var(--accent);
    border-radius:999px; padding:10px 20px; font-weight:700;
  }
  .btn.primary:hover{ filter:brightness(1.08); }
  .btn.ghost{ background:transparent; border-color:transparent; color:var(--ink-muted); padding:6px 8px; }
  .btn.ghost:hover{ color:var(--accent); }
  .btn.danger:hover{ border-color:var(--accent); color:var(--accent); }
  .btn.small{ padding:6px 10px; font-size:12.5px; }
  .btn.primary.small{ padding:7px 16px; }
  button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible{
    outline:2px solid var(--accent); outline-offset:2px;
  }

  /* card del giorno: un fuoco visivo in cima, con un alone caldo verso l'accento */
  .day-card{
    background:
      radial-gradient(120% 140% at 0% 0%, var(--accent-soft) 0%, transparent 58%),
      var(--surface);
    border:1px solid var(--line); border-radius:22px; padding:18px 18px 16px;
    margin-bottom:18px; box-shadow:var(--shadow);
  }
  .eyebrow{
    display:block; font-family:var(--font-mono); font-size:10px; font-weight:600;
    letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:6px;
  }
  .day-title{ font-family:var(--font-display); font-weight:800; font-size:26px; line-height:1; }
  .day-stats{
    display:flex; gap:20px; flex-wrap:wrap; align-items:baseline;
    margin-top:14px; font-size:12px; color:var(--ink-muted);
  }
  .stat{ display:inline-flex; align-items:baseline; gap:7px; }
  .stat + .stat{ padding-left:20px; border-left:1px solid var(--line); }
  .stat-n{ font-family:var(--font-mono); font-weight:600; color:var(--ink); font-variant-numeric:tabular-nums; }

  .day-header-row{ display:flex; align-items:center; justify-content:flex-start; margin-bottom:0; gap:8px; flex-wrap:wrap; }
  .day-azioni{ display:flex; gap:4px; flex:none; }
  .btn-icona{
    display:inline-flex; align-items:center; justify-content:center;
    width:30px; height:30px; padding:0; border-radius:9px; cursor:pointer;
    background:transparent; border:1px solid transparent; color:var(--ink-faint);
  }
  .btn-icona:hover{ color:var(--accent); border-color:var(--line-strong); }
  .day-name-edit{ display:flex; align-items:center; gap:8px; }
  .day-name-edit input{
    font-family:var(--font-display); font-weight:700; font-size:19px; padding:4px 8px;
    border:1px solid var(--line-strong); border-radius:6px; background:var(--surface-2); color:var(--ink);
  }

  .ex-list{ display:flex; flex-direction:column; gap:10px; }
  .ex-card{
    background:var(--surface); border:1px solid var(--line); border-radius:20px;
    box-shadow:var(--shadow); overflow:hidden;
  }
  .ex-head{
    display:flex; align-items:center; gap:12px; padding:10px 14px; cursor:pointer;
  }
  .ex-head:hover{ background:var(--surface-2); }
  /* nome e serie×ripetizioni impilati stretti, così la riga resta alta quanto la foto */
  .ex-testo{ flex:1 1 auto; min-width:0; display:flex; flex-direction:column; gap:1px; }
  .ex-name{ font-family:var(--font-display); font-weight:700; font-size:20px; line-height:1.15; }
  /* la nota accompagna il nome sulla stessa riga, non sotto */
  .ex-name .sub{
    font-family:var(--font-body); font-weight:500; font-size:12.5px; color:var(--ink-muted);
    margin-left:8px; white-space:nowrap;
  }
  .ex-target{ font-family:var(--font-mono); font-size:13px; color:var(--ink-muted); flex:none; }
  .ex-last{ display:flex; flex-direction:column; align-items:flex-end; flex:none; min-width:84px; }
  .ex-last .kg{ font-family:var(--font-mono); font-weight:600; font-size:17px; }
  .ex-last .delta{ font-family:var(--font-mono); font-size:11.5px; }
  .ex-last .delta.up{ color:var(--good); }
  .ex-last .delta.down{ color:var(--ink-muted); }
  .pr-badge{
    font-family:var(--font-mono); font-size:10px; letter-spacing:.05em; font-weight:600;
    background:var(--good-soft); color:var(--good); border-radius:99px; padding:2px 7px; margin-top:3px;
  }
  .ex-thumb{
    display:inline-flex; align-items:center; justify-content:center; flex:none;
    width:46px; height:46px; border-radius:13px; overflow:hidden;
    background:var(--surface-2); border:1px solid var(--line);
  }
  /* il disegno prende il colore dell'accento e lascia trasparente lo sfondo */
  .ex-thumb.con-disegno{ background:var(--accent-soft); border-color:var(--accent-soft); color:var(--accent); }
  .ex-thumb svg{ width:88%; height:88%; display:block; }
  .ex-num{
    font-family:var(--font-mono); font-size:13px; font-weight:600; color:var(--ink-faint);
  }
  .ex-card.open .ex-thumb{ border-color:var(--accent); }

  .ex-body{ border-top:1px solid var(--line); padding:16px; display:none; }
  .ex-card.open .ex-body{ display:block; }

  .ex-edit-btn{ flex:none; border:1px solid var(--line-strong); color:var(--ink-muted); }
  .ex-edit-btn:hover{ color:var(--accent); border-color:var(--accent); }

  .edit-form{
    display:grid; grid-template-columns:2fr 1fr 1fr; gap:10px; margin-bottom:16px;
    background:var(--surface-2); border:1px solid var(--line); border-radius:16px; padding:14px;
  }
  .field.full{ grid-column:1/-1; }
  .field label{
    display:block; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase;
    letter-spacing:.06em; color:var(--ink-muted); margin-bottom:4px;
  }
  /* min-width:0 impedisce agli input di sfondare la propria cella della griglia */
  .field{ min-width:0; }
  .field input, .field textarea{
    width:100%; max-width:100%; font-family:var(--font-body); font-size:14px; padding:8px 10px;
    border:1px solid var(--line-strong); border-radius:10px; background:var(--surface-2); color:var(--ink);
  }
  .field.mono input{ font-family:var(--font-mono); }
  .edit-form-actions{ grid-column:1/-1; display:flex; justify-content:flex-end; gap:8px; }

  .log-form{
    display:grid; grid-template-columns:repeat(3,1fr); gap:10px; align-items:end;
    background:var(--accent-soft); border:1px solid var(--line); border-radius:16px; padding:16px;
    margin-bottom:18px;
  }
  .log-form .submit-cell{ grid-column:1/-1; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .plate-hint{ font-family:var(--font-mono); font-size:11.5px; color:var(--ink-muted); }
  .plate-hint:empty{ display:none; }

  /* superset: ogni movimento ha il proprio riquadro con carico e ripetizioni */
  .log-form.superset{ grid-template-columns:1fr; gap:12px; }
  .ss-parte{
    display:flex; flex-direction:column; gap:8px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px; padding:12px;
  }
  .ss-nome{
    display:flex; align-items:center; gap:8px;
    font-family:var(--font-display); font-weight:700; font-size:17px; color:var(--ink);
  }
  .ss-num{
    display:inline-flex; align-items:center; justify-content:center; flex:none;
    width:20px; height:20px; border-radius:50%; background:var(--accent); color:var(--accent-ink);
    font-family:var(--font-mono); font-size:11px; font-weight:600;
  }
  .ss-campi{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .log-form.superset .ss-serie{ max-width:160px; }
  /* i riquadri numerati del modulo riprendono quelli della registrazione sessione */
  .blocco-movimento{ grid-column:1/-1; }
  .ss-riga-testa{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .campi-movimento{ grid-template-columns:1fr 62px 76px; }
  /* senza il campo serie dentro il riquadro restano due sole colonne */
  .campi-movimento:has(.field:nth-child(2):last-child){ grid-template-columns:1fr 104px; }
  /* nel superset le serie affiancano le note, perché valgono per tutti i movimenti */
  .riga-serie-note{ grid-column:1/-1; display:grid; grid-template-columns:auto 1fr; gap:10px; align-items:end; }
  .slot-serie:empty{ display:none; }
  .slot-serie .campo-serie{ width:76px; }
  .btn-piu{
    flex:none; width:32px; height:32px; border-radius:10px; cursor:pointer;
    background:var(--accent-soft); border:1px solid var(--accent); color:var(--accent);
    font-size:18px; line-height:1; font-weight:600;
  }
  .btn-piu:hover{ background:var(--accent); color:var(--accent-ink); }
  .btn-piu.rimuovi{
    background:transparent; border-color:var(--line-strong); color:var(--ink-faint); font-size:17px;
  }
  .btn-piu.rimuovi:hover{ border-color:var(--accent); color:var(--accent); background:transparent; }
  /* il contenitore delle righe superset attraversa tutta la griglia e, da vuoto,
     non deve occupare una cella: altrimenti sfasa i campi che seguono */
  .movimenti-extra{ grid-column:1/-1; }
  .movimenti-extra:empty{ display:none; }
  .riga-movimento{ margin-top:10px; }
  .ss-piu{ color:var(--accent); font-weight:700; margin:0 7px; }
  .ss-tag{
    display:inline-block; vertical-align:middle; margin-left:8px;
    font-family:var(--font-mono); font-size:9.5px; font-weight:600; letter-spacing:.08em;
    text-transform:uppercase; color:var(--accent); background:var(--accent-soft);
    border-radius:99px; padding:3px 8px;
  }
  .azioni-sessione{ display:flex; gap:8px; align-items:center; }
  .azioni-sessione .btn{ white-space:nowrap; }

  /* lo storico è una sezione che si apre a richiesta, staccata dal modulo */
  .storico-pannello{
    margin-top:16px; padding-top:16px; border-top:1px solid var(--line);
  }
  .storico-toggle{ width:100%; margin-top:10px; color:var(--ink-muted); }
  .storico-toggle:hover{ color:var(--accent); }

  .chart-wrap{ margin-bottom:16px; }
  .chart-wrap svg{ width:100%; height:auto; display:block; }
  .empty-note{
    font-size:13px; color:var(--ink-muted); background:var(--surface-2); border:1px dashed var(--line-strong);
    border-radius:8px; padding:12px 14px;
  }

  table.hist{ width:100%; border-collapse:collapse; font-size:13.5px; }
  table.hist th{
    text-align:left; font-family:var(--font-mono); font-size:10.5px; text-transform:uppercase;
    letter-spacing:.05em; color:var(--ink-muted); font-weight:500; padding:0 8px 6px; border-bottom:1px solid var(--line-strong);
  }
  table.hist td{ padding:8px; border-bottom:1px solid var(--line); font-family:var(--font-mono); }
  table.hist td.note{ font-family:var(--font-body); color:var(--ink-muted); }
  table.hist tr:last-child td{ border-bottom:none; }
  table.hist td.actions{ text-align:right; font-family:var(--font-body); }
  .hist-wrap{ overflow-x:auto; }

  .add-ex-zone{ margin-top:14px; }
  .add-ex-form{
    display:grid; grid-template-columns:2fr 1fr 1fr auto; gap:10px; align-items:end;
    background:var(--surface); border:1px dashed var(--line-strong); border-radius:16px; padding:14px; margin-top:10px;
  }
  .add-day-form{
    display:flex; gap:8px; align-items:center; margin-bottom:18px;
  }
  .add-day-form input{
    font-family:var(--font-body); font-size:14px; padding:8px 10px; border:1px solid var(--line-strong);
    border-radius:7px; background:var(--surface-2); color:var(--ink); flex:1;
  }
  .rename-day-form{ display:flex; gap:8px; align-items:center; }
  .rename-day-form input{
    font-family:var(--font-display); font-weight:700; font-size:20px; padding:5px 10px;
    border:1px solid var(--line-strong); border-radius:10px; background:var(--surface-2); color:var(--ink);
  }
  .confirm-row{ display:flex; align-items:center; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
  .confirm-row span{ font-size:12.5px; color:var(--ink-muted); }

  /* cronometro fluttuante: resta sopra al contenuto e sopra la tacca dell'iPhone */
  /* il timer esiste solo dentro una scheda */
  body:not(.in-scheda) .crono-bolla, body:not(.in-scheda) .crono-riquadro{ display:none !important; }
  .crono-bolla{
    position:fixed; right:16px; z-index:50; touch-action:none;
    bottom:calc(16px + env(safe-area-inset-bottom));
    display:inline-flex; align-items:center; justify-content:center;
    width:56px; height:56px; padding:0; border-radius:50%; cursor:pointer;
    background:var(--accent); color:var(--accent-ink); border:none;
    box-shadow:0 6px 20px rgba(0,0,0,.35);
  }
  .crono-bolla:hover{ filter:brightness(1.08); }
  .crono-bolla-dentro{
    position:relative; z-index:1; display:inline-flex; align-items:center; justify-content:center;
    font-family:var(--font-mono); font-size:14px; font-weight:600; font-variant-numeric:tabular-nums;
  }
  /* anello di avanzamento: parte in alto e si chiude col passare del recupero */
  .crono-anello{ position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  .crono-anello circle, .crono-anello-grande circle{ fill:none; stroke-linecap:round; }
  .crono-anello .anello-fondo{ stroke:var(--accent-ink); opacity:.22; stroke-width:4; }
  .crono-anello .anello-avanti{ stroke:var(--accent-ink); stroke-width:4; transition:stroke-dashoffset .2s linear; }
  .crono-bolla.inattivo .crono-anello{ display:none; }
  .crono-bolla.finito{ animation:crono-pulsa 1.1s ease-in-out infinite; }
  @keyframes crono-pulsa{
    0%,100%{ box-shadow:0 6px 20px rgba(0,0,0,.35); }
    50%{ box-shadow:0 6px 26px var(--accent-soft), 0 0 0 5px var(--accent-soft); }
  }

  .crono-riquadro{
    position:fixed; right:16px; z-index:51;
    bottom:calc(16px + env(safe-area-inset-bottom));
    width:228px; padding:18px;
    background:var(--surface); border:1px solid var(--line-strong); border-radius:30px;
    box-shadow:0 10px 32px rgba(0,0,0,.45);
  }
  .crono-quadrante{
    position:relative; width:132px; height:132px; margin:4px auto 12px;
    display:flex; align-items:center; justify-content:center;
  }
  .crono-anello-grande{ position:absolute; inset:0; width:100%; height:100%; transform:rotate(-90deg); }
  .crono-anello-grande .anello-fondo{ stroke:var(--line); stroke-width:8; }
  .crono-anello-grande .anello-avanti{ stroke:var(--accent); stroke-width:8; transition:stroke-dashoffset .2s linear; }
  .crono-riquadro.finito .crono-anello-grande .anello-avanti{ stroke:var(--good); }

  /* ruote di scelta del recupero: si scorrono come la sveglia del telefono */
  .crono-ruote{
    position:relative; display:flex; align-items:center; justify-content:center; gap:4px;
    height:102px; margin:6px 0 14px;
  }
  .ruota{
    height:102px; width:64px; overflow-y:auto; scroll-snap-type:y mandatory;
    scrollbar-width:none; -ms-overflow-style:none; -webkit-overflow-scrolling:touch;
    /* le voci lontane dal centro sfumano, come sul quadrante di un orologio */
    mask-image:linear-gradient(to bottom, transparent, #000 32%, #000 68%, transparent);
    -webkit-mask-image:linear-gradient(to bottom, transparent, #000 32%, #000 68%, transparent);
  }
  .ruota::-webkit-scrollbar{ display:none; }
  .ruota-lista{ padding:34px 0; }
  .ruota-voce{
    height:34px; display:flex; align-items:center; justify-content:center;
    scroll-snap-align:center; cursor:grab;
    font-family:var(--font-mono); font-size:23px; font-variant-numeric:tabular-nums;
    color:var(--ink-faint); transition:color .15s ease;
  }
  .ruota-voce.scelta{ color:var(--ink); font-weight:600; }
  .ruota-sep{ font-family:var(--font-mono); font-size:21px; color:var(--ink-muted); padding-bottom:2px; }
  .ruota-banda{
    position:absolute; left:8px; right:8px; top:34px; height:34px; pointer-events:none;
    border-radius:10px; background:var(--accent-soft); opacity:.55;
  }

  .crono-testa{ display:flex; align-items:center; justify-content:space-between; margin-bottom:6px; }
  .crono-etichetta{
    font-family:var(--font-mono); font-size:9.5px; font-weight:600; letter-spacing:.14em;
    text-transform:uppercase; color:var(--accent);
  }
  .crono-chiudi{
    display:inline-flex; padding:4px; border-radius:7px; cursor:pointer;
    background:transparent; border:none; color:var(--ink-faint);
  }
  .crono-chiudi:hover{ color:var(--accent); }
  .crono-tempo{
    position:relative; z-index:1;
    font-family:var(--font-mono); font-size:32px; font-weight:600; line-height:1;
    font-variant-numeric:tabular-nums; color:var(--ink);
  }
  .crono-riquadro.finito .crono-tempo{ color:var(--good); }
  .crono-azioni{ display:flex; gap:8px; }
  .crono-azioni .btn{ flex:1; }
  @media (prefers-reduced-motion: reduce){ .crono-bolla.in-corso{ animation:none; } }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-muted);
  }
  .empty-state h2{ font-family:var(--font-display); font-size:26px; color:var(--ink); margin:0 0 8px; }

  @media (max-width:620px){
    .shell{ padding:max(4px, env(safe-area-inset-top)) 14px 40px; }
    .brand h1{ font-size:30px; }
    /* la barra resta su una riga: le azioni vanno in alto a destra, non sotto */
    header.top{ align-items:flex-start; padding-bottom:16px; margin-bottom:18px; }
    .brand{ min-width:0; }

    .ex-head{ gap:10px; padding:10px 12px; }
    .ex-name{ font-size:18px; }
    .ex-last{ min-width:0; }

    .ex-body{ padding:14px; }
    /* 16px è la soglia sotto cui iOS ingrandisce la pagina al tocco su un campo */
    .field input, .field textarea, .add-day-form input, .rename-day-form input{ font-size:16px; }
    .edit-form, .add-ex-form{ grid-template-columns:1fr 1fr; }
    .log-form{ grid-template-columns:repeat(3,1fr); gap:8px; padding:14px; }
    .log-form .field label{ font-size:9.5px; letter-spacing:.03em; }
    .add-ex-form > div:last-child{ grid-column:1/-1; }
    .log-form .submit-cell{ flex-direction:column; align-items:stretch; }
    .azioni-sessione{ width:100%; }
    .azioni-sessione .btn[type="submit"]{ flex:1; }
    .edit-form-actions{ flex-wrap:wrap; }
    .edit-form-actions .btn{ flex:1 1 auto; }

    .day-header-row{ flex-wrap:wrap; }
    .day-header-row > div{ flex-wrap:wrap; }
    .day-name-edit{ min-width:0; }
    .rename-day-form{ flex-wrap:wrap; }
    .rename-day-form input{ flex:1 1 100%; min-width:0; font-size:18px; }
    .confirm-row{ justify-content:flex-start; }

    table.hist{ font-size:12.5px; }
    table.hist td, table.hist th{ padding:7px 6px; white-space:nowrap; }
    table.hist td.note{ white-space:normal; min-width:90px; }
  }
</style><style>
  body{
    padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
</style>
</head>
<body>
<div class="shell">
  <header class="top">
    <div class="intestazione-app">
      <span class="oggi" id="oggi"></span>
      <span class="nome-app">my workout planner</span>
      <div class="azioni-top" id="azioniTop"></div>
    </div>
    <div class="riga-titolo">
      <div class="brand">
        <h1 id="titolo"></h1>
        <p id="sottotitolo"></p>
      </div>
      <div class="azioni-titolo" id="azioniTitolo"></div>
    </div>
    <div id="settimana"></div>
  </header>

  <main id="home"></main>

  <div class="day-tabs" id="dayTabs"></div>

  <div id="addDayZone"></div>

  <main id="dayPanel"></main>
</div>

<!-- impostazioni: coprono tutto, con il contenuto dietro sfocato -->
<div class="velo" id="velo" hidden>
  <div class="foglio" role="dialog" aria-modal="true" aria-label="Impostazioni">
    <div class="foglio-testa">
      <span class="foglio-titolo">Impostazioni</span>
      <button class="btn-icona" data-action="toggle-impostazioni" aria-label="Chiudi">
        <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="foglio-corpo" id="foglioCorpo"></div>
  </div>
</div>

<!-- cronometro: vive fuori dalla pagina che si ridisegna, così non perde mai il conteggio -->
<button class="crono-bolla" id="cronoBolla" aria-label="Apri il timer di recupero">
  <svg class="crono-anello" viewBox="0 0 56 56" aria-hidden="true">
    <circle class="anello-fondo" cx="28" cy="28" r="24"></circle>
    <circle class="anello-avanti" id="cronoAnelloBolla" cx="28" cy="28" r="24"></circle>
  </svg>
  <span class="crono-bolla-dentro" id="cronoBollaDentro">
    <svg viewBox="0 0 24 24" width="21" height="21" aria-hidden="true">
      <circle cx="12" cy="13.5" r="7.5" fill="none" stroke="currentColor" stroke-width="2"/>
      <path d="M12 9.8v3.7l2.4 1.6M9.4 2.5h5.2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    </svg>
  </span>
</button>

<div class="crono-riquadro" id="cronoRiquadro" hidden>
  <div class="crono-testa">
    <span class="crono-etichetta">Recupero</span>
    <button class="crono-chiudi" id="cronoChiudi" aria-label="Chiudi il timer">
      <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>

  <div class="crono-quadrante" id="cronoQuadrante" hidden>
    <svg class="crono-anello-grande" viewBox="0 0 132 132" aria-hidden="true">
      <circle class="anello-fondo" cx="66" cy="66" r="58"></circle>
      <circle class="anello-avanti" id="cronoAnello" cx="66" cy="66" r="58"></circle>
    </svg>
    <span class="crono-tempo" id="cronoTempo">1:30</span>
  </div>

  <!-- prima dell'avvio si sceglie il recupero facendo scorrere le due ruote -->
  <div class="crono-ruote" id="cronoRuote">
    <div class="ruota" id="ruotaMinuti" aria-label="Minuti"></div>
    <span class="ruota-sep">:</span>
    <div class="ruota" id="ruotaSecondi" aria-label="Secondi"></div>
    <div class="ruota-banda" aria-hidden="true"></div>
  </div>

  <div class="crono-azioni">
    <button class="btn primary small" id="cronoAvvia">Avvia</button>
    <button class="btn small" id="cronoAzzera">Azzera</button>
  </div>
</div>

<script>
(function(){
  "use strict";

  const STORAGE_KEY = "schedaDiFerro:v1";

      `<path d="M16.2 12.2a1.4 1.4 0 00.28 1.54l.05.05a1.7 1.7 0 11-2.4 2.4l-.05-.05a1.4 1.4 0 00-1.54-.28 1.4 1.4 0 00-.85 1.28v.14a1.7 1.7 0 11-3.4 0v-.07a1.4 1.4 0 00-.92-1.28 1.4 1.4 0 00-1.54.28l-.05.05a1.7 1.7 0 11-2.4-2.4l.05-.05a1.4 1.4 0 00.28-1.54 1.4 1.4 0 00-1.28-.85h-.14a1.7 1.7 0 110-3.4h.07a1.4 1.4 0 001.28-.92 1.4 1.4 0 00-.28-1.54l-.05-.05a1.7 1.7 0 112.4-2.4l.05.05a1.4 1.4 0 001.54.28h.07a1.4 1.4 0 00.85-1.28v-.14a1.7 1.7 0 113.4 0v.07a1.4 1.4 0 00.85 1.28 1.4 1.4 0 001.54-.28l.05-.05a1.7 1.7 0 112.4 2.4l-.05.05a1.4 1.4 0 00-.28 1.54v.07a1.4 1.4 0 001.28.85h.14a1.7 1.7 0 110 3.4h-.07a1.4 1.4 0 00-1.28.85z" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>`)
  };

  function uid(prefix){ return prefix + "-" + Math.random().toString(36).slice(2,9); }
  function todayISO(){ return new Date().toISOString().slice(0,10); }
  function fmtDate(iso){
    const [y,m,d] = iso.split("-");
    return d + "/" + m + "/" + y.slice(2);
  }
  function esc(s){
    return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }

  function defaultState(){
    return {
      schede: [{
        id: uid("sc"), nome: "La mia scheda", creata: todayISO(),
        giorni: [
        {
          id: uid("g"), nome: "Giorno A — Spinta", ordine: 0,
          esercizi: [
            { id: uid("e"), nome: "Panca piana con bilanciere", serieTarget: 4, ripTarget: "6-8", note: "", storico: [] },
            { id: uid("e"), nome: "Military press manubri", serieTarget: 3, ripTarget: "8-10", note: "", storico: [] },
            { id: uid("e"), nome: "Croci ai cavi alti", serieTarget: 3, ripTarget: "12-15", note: "", storico: [] },
            { id: uid("e"), nome: "French press bilanciere", serieTarget: 3, ripTarget: "10-12", note: "", storico: [] },
            { id: uid("e"), nome: "Dip alle parallele", serieTarget: 3, ripTarget: "max", note: "zavorra se serve", storico: [] }

        },
        {
          id: uid("g"), nome: "Giorno B — Trazione", ordine: 1,
          esercizi: [
            { id: uid("e"), nome: "Stacco da terra", serieTarget: 4, ripTarget: "5", note: "", storico: [] },

  // Chi ha già dei dati li ha salvati come { giorni: [...] }: li avvolgo in una scheda,

  function migra(dati){

    if (dati && dati.schede){

  // ---- plate calculator ----
  function calcolaDischi(caricoTotale){
    if (!caricoTotale || caricoTotale <= BAR_KG) return "solo bilanciere (20 kg)";
    let perLato = (caricoTotale - BAR_KG) / 2;
    let remaining = perLato;
    const parts = [];
    for (const p of PLATES){
      const count = Math.floor((remaining + 0.001) / p);
      if (count > 0){ parts.push(count + "×" + p); remaining -= count * p; }
    }
    if (remaining > 0.05){
      return perLato.toFixed(2).replace(".00","") + " kg/lato — non esatto con dischi standard";
    }
    return parts.join(" + ") + " per lato (bilanciere 20 kg)";
  }

  // Parole intere, non sottostringhe: senza questo "lat machine" finirebbe

  function parolaPresente(testo, parola){
    return new RegExp("(^|[^a-zà-ù])" + parola.replace("-", "[-\s]") + "([^a-zà-ù]|$)").test(testo);
  }

  function disegnoPer(nome){
    const testo = " " + String(nome || "").toLowerCase() + " ";
    for (const [chiavi, id] of DISEGNI){

  const disegniCaricati = new Map();   // id -> markup già ricolorato

  function ripulisciDisegno(svg){
    return svg
      .replace(/<\?xml[^>]*\?>/g, "")
      .replace(/<!--[\s\S]*?-->/g, "")
      // il bianco sparisce, ogni altra tinta prende il colore del tema
      .replace(/fill="#(?:fff|ffffff)"/gi, 'fill="none"')
      .replace(/fill="#[0-9a-f]{3,6}"/gi, 'fill="currentColor"')
      .replace(/\s+width="[^"]*"/g, "")
      .replace(/\s+height="[^"]*"/g, "")
      .replace(/\s+/g, " ");
  }

  async function caricaDisegno(id){
    if (disegniCaricati.has(id) || disegniInCorso.has(id)) return;
    disegniInCorso.add(id);
    try{
      const r = await fetch(BASE_DIS + id + "-tension.svg");
      if (!r.ok) throw new Error("non trovato");
      disegniCaricati.set(id, ripulisciDisegno(await r.text()));
      render();
    }catch(e){
      disegniCaricati.set(id, null);    // niente disegno: resta il numero
    }finally{
      disegniInCorso.delete(id);
    }
  }

  // assegna il disegno a un esercizio in base al nome

  // ---- progression helpers ----

  // Un superset salva le sue parti in s.parti; un esercizio normale ha s.carico.
  // Progressione, PR e grafico seguono sempre il primo movimento.
  function caricoPrincipale(s){
    if (s.parti && s.parti.length) return s.parti[0].carico;
    return s.carico;
  }
  function ripetizioniTeste(s){
    if (s.parti && s.parti.length) return s.parti.map(p => p.ripetizioni).join(" / ");
    return s.ripetizioni;
  }
  function caricoTesto(s){
    if (s.parti && s.parti.length) return s.parti.map(p => p.carico).join(" / ") + " kg";
    return s.carico + " kg";
  }
  function eSuperset(ex){ return !!(ex.parti && ex.parti.length > 1); }

  // "8 - 10" e "8-10" diventano entrambi "8-10"; un numero singolo resta tale
  function normalizzaRip(valore){
    return String(valore || "").replace(/\s+/g, "").slice(0,9);
  }

  // Un movimento nel modulo di creazione/modifica: stessi riquadri numerati
  // che si usano per registrare la sessione, così le due schermate si somigliano.
  // Il primo è l'esercizio principale, gli altri sono i compagni di superset.
  // Le serie valgono per tutto l'esercizio: nel singolo stanno in fila col nome,
  // nel superset salgono in cima perché comuni a tutti i movimenti.
  function campoSerieHtml(valore){
    return `<div class="field campo-serie"><label>Serie</label>
      <input type="number" name="serieTarget" min="1" max="20" inputmode="numeric" value="${valore}" required></div>`;
  }

  function bloccoMovimento({ numero, nome, rip, principale, serie }){
    // nell'esercizio singolo il riquadro non serve: nome, serie e ripetizioni stanno in fila
    const campoSerie = serie !== undefined ? campoSerieHtml(serie) : "";
    return `<div class="ss-parte blocco-movimento">
      <div class="ss-riga-testa">
        <span class="ss-nome"><span class="ss-num">${numero}</span>${principale ? "Esercizio" : "In superset con"}</span>
        ${principale
          ? `<button type="button" class="btn-piu" data-action="aggiungi-movimento" title="Aggiungi un esercizio in superset">+</button>`
          : `<button type="button" class="btn-piu rimuovi" data-action="rimuovi-movimento" title="Togli questo esercizio">×</button>`}
      </div>
      <div class="ss-campi campi-movimento">
        <div class="field"><label>Nome</label>
          <input type="text" name="${principale ? "nome" : "nomeExtra"}" value="${esc(nome || "")}"
                 placeholder="Nome esercizio" maxlength="60" ${principale ? "required" : ""}></div>
        ${campoSerie}
        <div class="field"><label>Ripetizioni</label>
          <input type="text" name="${principale ? "ripTarget" : "ripExtra"}" value="${esc(rip || "")}"
                 placeholder="es. 8-10" maxlength="12" ${principale ? "required" : ""}></div>
      </div>
    </div>`;
  }

  // diventato superset le serie salgono in cima; tornando singolo rientrano in fila
  function spostaSerie(form){
    const campo = form.querySelector(".campo-serie");
    if (!campo) return;
    const superset = form.querySelectorAll(".movimenti-extra .blocco-movimento").length > 0;
    const alto = form.querySelector(".slot-serie");
    const dentro = form.querySelector(".blocco-movimento .campi-movimento");
    if (superset && campo.parentElement !== alto){
      alto.appendChild(campo);
    } else if (!superset && campo.parentElement === alto){
      dentro.insertBefore(campo, dentro.lastElementChild);   // fra nome e ripetizioni
    }
  }

  // dopo un'aggiunta o una rimozione i numeri devono tornare consecutivi
  function rinumeraMovimenti(form){
    form.querySelectorAll(".movimenti-extra .ss-num").forEach((el, i) => {
      el.textContent = i + 2;
    });

  // Con uno o più movimenti aggiuntivi l'esercizio diventa un superset; senza torna singolo.
  // Lo storico già registrato non viene toccato: ogni sessione si legge dal proprio formato.
  function applicaSuperset(ex, nomiExtra, ripExtra){
    const nomi = nomiExtra || [];
    const rip = ripExtra || [];
    const extra = nomi
      .map((n, i) => ({ nome: String(n || "").trim().slice(0,60),
                        ripTarget: String(rip[i] || "").trim().slice(0,12) }))
      .filter(p => p.nome);
    if (extra.length){
      // il primo movimento tiene le ripetizioni del campo principale
      ex.parti = [{ nome: ex.nome, ripTarget: ex.ripTarget }, ...extra];
    } else {
      delete ex.parti;
    }
  }

  // legge i movimenti aggiuntivi di un modulo, con le rispettive ripetizioni
  function movimentiExtraDi(form){
    const d = new FormData(form);

  }

  // ripetizioni target di una parte, con ricaduta su quelle generali dell'esercizio
  function ripDiParte(ex, i){
    const p = ex.parti && ex.parti[i];
    return (p && p.ripTarget) || ex.ripTarget;
  }

  function ultimiDati(storico){
    if (!storico.length) return null;
    const sorted = [...storico].sort((a,b) => a.data.localeCompare(b.data));
    const last = sorted[sorted.length - 1];
    const prev = sorted.length > 1 ? sorted[sorted.length - 2] : null;
    const pr = Math.max(...sorted.map(caricoPrincipale));
    return { last, prev, pr, sorted };
  }

  function sparklineSVG(sorted){
    // narrow viewBox on phones so labels don't shrink when the SVG scales to the card
    const narrow = window.innerWidth <= 620;
    const w = narrow ? 320 : 560;
    const h = narrow ? 128 : 118;
    // a destra resta spazio per l'etichetta del carico attuale, a sinistra per la scala
    const padL = narrow ? 32 : 40, padR = narrow ? 50 : 58, padT = 18, padB = 24;
    const values = sorted.map(caricoPrincipale);
    const min = Math.min(...values), max = Math.max(...values);
    const piatto = max === min;
    const innerW = w - padL - padR, innerH = h - padT - padB;

    // con un solo valore, o valori tutti uguali, la linea sta a metà invece che sul fondo
    const y = (v) => piatto ? padT + innerH/2 : padT + innerH - ((v - min)/(max - min)) * innerH;
    const pts = sorted.map((s,i) => {
      const c = caricoPrincipale(s);
      const x = padL + (sorted.length === 1 ? innerW/2 : (i/(sorted.length-1)) * innerW);
      return { x, y: y(c), carico:c, data:s.data };
    });
    const baseY = padT + innerH;
    const poly = pts.map(p => p.x.toFixed(1) + "," + p.y.toFixed(1)).join(" ");
    // area sotto la linea: dà corpo al grafico senza aggiungere inchiostro forte
    const area = `M ${pts[0].x.toFixed(1)},${baseY} L ${poly.split(" ").join(" L ")} L ${pts[pts.length-1].x.toFixed(1)},${baseY} Z`;

    const last = pts[pts.length-1], first = pts[0];
    const iPR = values.indexOf(max);
    const prSeparato = iPR !== pts.length - 1;   // il record non è l'ultima sessione

    const punti = pts.map((p,i) => {
      const ultimo = i === pts.length - 1;
      return `<circle class="${ultimo ? "pt pt-ultimo" : "pt"}" cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${ultimo ? 4.5 : 3}"></circle>`;
    }).join("");

    // etichette scelte: solo i valori che servono davvero, mai un numero su ogni punto
    const etichettaUltimo = `<text class="valore" x="${(last.x + 9).toFixed(1)}" y="${(last.y + 4).toFixed(1)}">${last.carico} kg</text>`;
    const etichettaPR = prSeparato
      ? `<text class="pr-label" x="${pts[iPR].x.toFixed(1)}" y="${(pts[iPR].y - 10).toFixed(1)}" text-anchor="middle">record</text>`
      : "";

    const date = sorted.length === 1
      ? `<text class="data" x="${first.x.toFixed(1)}" y="${h-7}" text-anchor="middle">${fmtDate(first.data)}</text>`
      : `<text class="data" x="${padL}" y="${h-7}" text-anchor="start">${fmtDate(first.data)}</text>
         <text class="data" x="${(w-padR).toFixed(1)}" y="${h-7}" text-anchor="end">${fmtDate(last.data)}</text>`;

    const scala = piatto
      ? `<text class="asse" x="${padL-8}" y="${(y(max)+4).toFixed(1)}" text-anchor="end">${max}</text>`
      : `<text class="asse" x="${padL-8}" y="${(y(max)+4).toFixed(1)}" text-anchor="end">${max}</text>
         <text class="asse" x="${padL-8}" y="${(y(min)+4).toFixed(1)}" text-anchor="end">${min}</text>`;

    return `<svg viewBox="0 0 ${w} ${h}" class="sparkline" role="img"
      aria-label="Andamento del carico: da ${first.carico} a ${last.carico} kg">
      <style>
        .sparkline .asse{ font-family:'IBM Plex Mono',monospace; font-size:11px; fill:var(--ink-faint); }
        .sparkline .data{ font-family:'IBM Plex Mono',monospace; font-size:10.5px; fill:var(--ink-faint); }
        .sparkline .valore{ font-family:'IBM Plex Mono',monospace; font-size:12.5px; font-weight:600; fill:var(--ink); }
        .sparkline .pr-label{ font-family:'IBM Plex Mono',monospace; font-size:9.5px; letter-spacing:.06em; fill:var(--good); }
        .sparkline .linea{ fill:none; stroke:var(--accent); stroke-width:2; stroke-linejoin:round; stroke-linecap:round; }
        .sparkline .area{ fill:var(--accent); opacity:.12; }
        .sparkline .griglia{ stroke:var(--line); stroke-width:1; }
        .sparkline .pt{ fill:var(--surface); stroke:var(--accent); stroke-width:2; }
        .sparkline .pt-ultimo{ fill:var(--accent); }
      </style>
      <line class="griglia" x1="${padL}" y1="${baseY}" x2="${(w-padR).toFixed(1)}" y2="${baseY}"></line>
      ${piatto ? "" : `<line class="griglia" x1="${padL}" y1="${padT}" x2="${(w-padR).toFixed(1)}" y2="${padT}" stroke-dasharray="3 4"></line>`}
      <path class="area" d="${area}"></path>
      <polyline class="linea" points="${poly}"></polyline>
      ${punti}
      ${scala}
      ${date}
      ${etichettaPR}
      ${etichettaUltimo}
    </svg>`;
  }

  // ---- tema ----
  // "auto" non mette nessun attributo, così restano validi i colori di sistema
  function applicaTema(valore){
    if (valore === "auto") delete document.documentElement.dataset.theme;
    else document.documentElement.dataset.theme = valore;
    try{ localStorage.setItem(CHIAVE_TEMA, valore); }catch(e){}
  }

  // ---- esporta / importa ----
  // La scheda esportata è il programma, non il diario: niente storico.
  // Esce come tabella CSV, con una sezione per ogni giorno.
  function schedaInTabella(sc){
    const campo = (v) => {
      const t = String(v ?? "");
      // vanno protetti i campi che contengono separatore, virgolette o un a capo
      const daProteggere = t.includes(";") || t.includes('"') || t.includes("\n") || t.includes("\r");
      return daProteggere ? '"' + t.replace(/"/g, '""') + '"' : t;
    };
    const righe = [];
    for (const g of sc.giorni){
      righe.push(campo(g.nome));                          // il giorno intitola la tabella
      righe.push(["Nome","Serie","Ripetizioni","Note"].join(";"));
      for (const e of g.esercizi){
        if (eSuperset(e)){
          e.parti.forEach((parte, i) => {
            righe.push([campo(parte.nome), i === 0 ? e.serieTarget : "",
                        campo(ripDiParte(e, i)),
                        campo(i === 0 ? (e.note || "") : "in superset")].join(";"));
          });
        } else {
          righe.push([campo(e.nome), e.serieTarget, campo(e.ripTarget), campo(e.note || "")].join(";"));
        }
      }
      righe.push("");                                     // riga vuota fra un giorno e l'altro
    }
    return righe.join("\r\n");
  }

  async function esportaScheda(){
    const sc = schedaCorrente();
    if (!sc) return;
    const testo = "﻿" + schedaInTabella(sc);          // il segno iniziale fa aprire bene gli accenti
    const nomeFile = sc.nome.replace(/[^\w\s-]/g, "").trim().replace(/\s+/g, "-") + ".csv";
    const file = new File([testo], nomeFile, { type: "text/csv" });

    // sul telefono conviene il foglio di condivisione, altrove il salvataggio diretto
    if (navigator.canShare && navigator.canShare({ files: [file] })){
      try{ await navigator.share({ files: [file], title: sc.nome }); return; }catch(e){ if (e.name === "AbortError") return; }
    }
    const url = URL.createObjectURL(file);
    const a = document.createElement("a");
    a.href = url; a.download = nomeFile;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  }

  function importaDaTesto(testo){
    let dati;
    try{ dati = JSON.parse(testo); }catch(e){ return "Il file non è leggibile."; }
    if (!dati || !Array.isArray(dati.giorni)) return "Questo file non contiene una scheda.";

    const nuova = {
      id: uid("sc"), nome: (dati.nome || "Scheda importata").slice(0,60), creata: todayISO(),
      giorni: dati.giorni.map((g, i) => ({
        id: uid("g"), nome: (g.nome || "Giorno").slice(0,60), ordine: g.ordine ?? i,
        esercizi: (g.esercizi || []).map(e => {
          const ex = {
            id: uid("e"), nome: (e.nome || "Esercizio").slice(0,60),
            serieTarget: parseInt(e.serieTarget,10) || 3,
            ripTarget: String(e.ripTarget || "10").slice(0,12),
            note: String(e.note || "").slice(0,120),
            storico: []                      // il diario resta quello di chi importa
          };
          if (Array.isArray(e.parti) && e.parti.length > 1){
            ex.parti = e.parti.map(p => ({ nome: String(p.nome || "").slice(0,60),
                                           ripTarget: String(p.ripTarget || "").slice(0,12) }));
          }
          return ex;
        })
      }))
    };
    state.schede.push(nuova);
    saveLocal();
    if (dbReady && db) db.doc("schede/" + nuova.id).set(nuova).catch(()=>{});
    recuperaImmaginiMancanti();
    return null;
  }

  // Striscia della settimana corrente: segna i giorni in cui risulta un allenamento.
  // Si basa sulle date delle sessioni registrate, in tutte le schede.
  function renderSettimana(contenitore, mostra){
    contenitore.hidden = !mostra;
    if (!mostra) return;

    const allenati = new Set(
      state.schede.flatMap(sc => sc.giorni)
        .flatMap(g => g.esercizi)
        .flatMap(e => e.storico || [])
        .map(s => s.data)
    );

    const oggi = new Date();
    const giornoSettimana = (oggi.getDay() + 6) % 7;          // lunedì = 0
    const lunedi = new Date(oggi);
    lunedi.setDate(oggi.getDate() - giornoSettimana);

    const iniziali = ["L","M","M","G","V","S","D"];
    const celle = iniziali.map((lettera, i) => {
      const giorno = new Date(lunedi);
      giorno.setDate(lunedi.getDate() + i);
      const dataCella = giorno.getFullYear() + "-" +
        String(giorno.getMonth()+1).padStart(2,"0") + "-" +
        String(giorno.getDate()).padStart(2,"0");
      const classi = ["giorno-cella"];
      if (allenati.has(dataCella)) classi.push("allenato");
      if (i === giornoSettimana) classi.push("oggi");
      return `<div class="${classi.join(" ")}">
        <span class="giorno-lettera">${lettera}</span>
        <span class="giorno-numero">${giorno.getDate()}</span>
      </div>`;
    }).join("");

    // confronto fra date in formato testo: evita gli scherzi dell'ora del giorno
    const iso = (d) => d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
    const domenica = new Date(lunedi); domenica.setDate(lunedi.getDate() + 6);
    const quanti = [...allenati].filter(d => d >= iso(lunedi) && d <= iso(domenica)).length;

    contenitore.className = "blocco-settimana";
    contenitore.innerHTML = `
      <div class="settimana-testa">
        <span class="eyebrow">La tua settimana</span>
        <span class="settimana-conto">${quanti ? quanti + (quanti === 1 ? " allenamento" : " allenamenti") : "nessun allenamento"}</span>
      </div>
      <div class="settimana">${celle}</div>`;
  }

  // Riga di statistiche sotto il nome del giorno: a colpo d'occhio dove sei.
  function riepilogoGiorno(day){
    const esercizi = day.esercizi.length;
    const tutteLeSessioni = day.esercizi.flatMap(e => e.storico || []);
    const ultima = tutteLeSessioni.length
      ? tutteLeSessioni.map(s => s.data).sort().slice(-1)[0]
      : null;

    return `<div class="dati-riquadri">
      <span class="dato"><span class="dato-ico">${ICONE.lista}</span>${esercizi} ${esercizi === 1 ? "esercizio" : "esercizi"}</span>
      <span class="dato"><span class="dato-ico">${ICONE.orologio}</span>${ultima ? fmtDate(ultima) : "mai allenato"}</span>
    </div>`;
  }

  function renderExercise(day, ex, posizione){
    const open = ui.openEx.has(ex.id);
    const editing = ui.editEx.has(ex.id);
    const info = ultimiDati(ex.storico);

    let lastBlock = `<span class="kg">—</span>`;
    if (info){
      let deltaHtml = "";
      if (info.prev){
        const diff = caricoPrincipale(info.last) - caricoPrincipale(info.prev);
        const sign = diff > 0 ? "+" : "";
        if (diff !== 0) deltaHtml = `<span class="delta ${diff > 0 ? "up" : "down"}">${sign}${diff} kg</span>`;
      }
      lastBlock = `<span class="kg">${caricoTesto(info.last)}</span>${deltaHtml}`;
    }

    let editHtml = "";
    if (editing){
      const actionsHtml = ui.confirmDeleteEx === ex.id
        ? `<div class="confirm-row" style="width:100%;">
            <span>Eliminare "${esc(ex.nome)}" e il suo storico?</span>
            <button type="button" class="btn small danger" data-action="delete-ex-confirm" data-day="${day.id}" data-ex="${ex.id}">Sì, elimina</button>
            <button type="button" class="btn ghost small" data-action="delete-ex-cancel">Annulla</button>
          </div>`
        : `<button type="button" class="btn ghost small" data-action="delete-ex" data-ex="${ex.id}">Elimina esercizio</button>
           <button type="button" class="btn small" data-action="toggle-edit-ex" data-ex="${ex.id}">Chiudi</button>
           <button type="submit" class="btn primary small">Salva</button>`;
      editHtml = `
        <form class="edit-form" data-form="edit-ex" data-day="${day.id}" data-ex="${ex.id}">
          ${bloccoMovimento({ numero: 1, nome: ex.nome, rip: ripDiParte(ex, 0), principale: true,
                              serie: eSuperset(ex) ? undefined : ex.serieTarget })}
          <div class="movimenti-extra">${
            eSuperset(ex)
              ? ex.parti.slice(1).map((p, i) =>
                  bloccoMovimento({ numero: i + 2, nome: p.nome, rip: p.ripTarget })).join("")
              : ""
          }</div>
          <div class="riga-serie-note">
            <div class="slot-serie">${eSuperset(ex) ? campoSerieHtml(ex.serieTarget) : ""}</div>
            <div class="field"><label>Note</label><input type="text" name="note" value="${esc(ex.note || "")}" maxlength="120" placeholder="es. presa larga, tempo 3-1-1"></div>
          </div>
          <div class="edit-form-actions">
            ${actionsHtml}
          </div>
        </form>`;
    }

    // suggerisce il carico dell'ultima volta, per parte
    const ultimoCarico = (i) => {
      if (!info) return "";
      const l = info.last;
      if (l.parti && l.parti[i]) return l.parti[i].carico;
      return i === 0 ? (l.carico || "") : "";
    };
    // il segnaposto suggerisce le ripetizioni previste dalla scheda per quel movimento
    const campoRip = (nome, i) => `<div class="field"><label>Ripetizioni</label>
      <input type="text" name="${nome}" pattern="[0-9]{1,3}(\\s?-\\s?[0-9]{1,3})?" placeholder="${esc(ripDiParte(ex, i) || "8 o 8-10")}" maxlength="9" required></div>`;
    const campoCarico = (nome, i) => `<div class="field mono"><label>Carico (kg)</label>
      <input type="number" name="${nome}" step="0.5" min="0" inputmode="decimal" placeholder="${ultimoCarico(i) || 0}" required></div>`;

    // i due pulsanti dell'azione: registrare, oppure consultare quanto già fatto
    const storicoAperto = ui.storicoAperto.has(ex.id);
    const quante = ex.storico.length;
    const azioni = `<div class="azioni-sessione">
        <button type="submit" class="btn primary small">${ICONE.spunta}Registra sessione</button>
        <button type="button" class="btn small" data-action="toggle-storico-aperto" data-ex="${ex.id}">
          ${storicoAperto ? ICONE.chiudi + "Chiudi" : ICONE.grafico + `Storico${quante ? " (" + quante + ")" : ""}`}
        </button>
      </div>`;

    let logForm;
    if (eSuperset(ex)){
      const parti = ex.parti.map((p, i) => `
        <div class="ss-parte">
          <span class="ss-nome"><span class="ss-num">${i+1}</span>${esc(p.nome)}</span>
          <div class="ss-campi">
            ${campoCarico("carico" + i, i)}
            ${campoRip("rip" + i, i)}
          </div>
          <span class="plate-hint" data-plate-hint></span>
        </div>`).join("");
      logForm = `
        <form class="log-form superset" data-form="log-session" data-day="${day.id}" data-ex="${ex.id}">
          ${parti}
          <div class="field ss-serie"><label>Serie (per entrambi)</label><input type="number" name="serie" min="1" max="20" inputmode="numeric" value="${ex.serieTarget}" required></div>
          <div class="submit-cell">${azioni}</div>
        </form>`;
    } else {
      logForm = `
        <form class="log-form" data-form="log-session" data-day="${day.id}" data-ex="${ex.id}">
          ${campoCarico("carico", 0)}
          <div class="field"><label>Serie</label><input type="number" name="serie" min="1" max="20" inputmode="numeric" value="${ex.serieTarget}" required></div>
          ${campoRip("ripetizioni", 0)}
          <div class="submit-cell">
            <span class="plate-hint" data-plate-hint></span>
            ${azioni}
          </div>
        </form>`;
    }

    let chartBlock = `<div class="empty-note">Nessuna sessione registrata per questo esercizio. Registra la prima qui sopra.</div>`;
    let histBlock = "";
    if (info){
      chartBlock = `<div class="chart-wrap">${sparklineSVG(info.sorted)}</div>`;

      const tutte = [...info.sorted].reverse();
      const espanso = ui.storicoEspanso.has(ex.id);
      const visibili = espanso ? tutte : tutte.slice(0, 5);

      const rows = visibili.map(s => `
        <tr>
          <td>${fmtDate(s.data)}</td>
          <td>${caricoTesto(s)}</td>
          <td>${s.serie}×${ripetizioniTeste(s)}</td>
          <td class="actions">${
            ui.confirmDeleteHist === s.id
              ? `<button class="btn small danger" data-action="delete-hist-confirm" data-day="${day.id}" data-ex="${ex.id}" data-hist="${s.id}">Conferma</button>
                 <button class="btn ghost small" data-action="delete-hist-cancel">Annulla</button>`
              : `<button class="btn ghost small" data-action="delete-hist" data-hist="${s.id}">Elimina</button>`
          }</td>
        </tr>`).join("");

      const piuVecchie = tutte.length - visibili.length;
      const toggleStorico = tutte.length > 5
        ? `<button class="btn small storico-toggle" data-action="toggle-storico" data-ex="${ex.id}">
             ${espanso ? "Mostra solo le ultime 5" : `Mostra tutte le ${tutte.length} sessioni (${piuVecchie} più vecchie)`}
           </button>`
        : "";

      histBlock = `
        <div class="hist-wrap">

    }

    return `
      <div class="ex-card ${open ? "open" : ""}" data-ex-card="${ex.id}">
        <div class="ex-head" data-action="toggle-ex" data-ex="${ex.id}">
          <span class="ex-thumb${ex.disegno && disegniCaricati.get(ex.disegno) ? " con-disegno" : ""}">${
            (ex.disegno && disegniCaricati.get(ex.disegno)) || `<span class="ex-num">${posizione}</span>`
          }</span>
          <div class="ex-testo">
            <div class="ex-name">${
            eSuperset(ex)
              ? ex.parti.map(p => esc(p.nome)).join(`<span class="ss-piu">+</span>`) + `<span class="ss-tag">superset</span>`
              : esc(ex.nome)
          }${ex.note ? `<span class="sub">${esc(ex.note)}</span>` : ""}</div>
            <div class="ex-target">${ex.serieTarget}×${
              eSuperset(ex)
                ? ex.parti.map((p,i) => esc(ripDiParte(ex,i))).join(" / ")
                : esc(ex.ripTarget)
            }</div>
          </div>
          <div class="ex-last">${lastBlock}</div>
          ${open ? `<button class="btn ghost small ex-edit-btn" data-action="toggle-edit-ex" data-ex="${ex.id}">${editing ? "Annulla" : "Modifica"}</button>` : ""}
        </div>
        <div class="ex-body">
          ${editHtml}
          ${editing ? "" : logForm}
          ${!editing && storicoAperto ? `<div class="storico-pannello">${chartBlock}${histBlock}</div>` : ""}
        </div>
      </div>`;
  }

  // Chiudendo la tendina le modifiche in corso vengono salvate, non perse.
  // Solo "Annulla" le scarta di proposito.
  function salvaModificheAperte(){
    const form = document.querySelector('form[data-form="edit-ex"]');
    if (!form) return;
    const dayId = form.getAttribute("data-day"), exId = form.getAttribute("data-ex");
    const day = getDay(dayId), ex = getEx(dayId, exId);
    if (!day || !ex) return;

    const d = Object.fromEntries(new FormData(form).entries());
    const nome = (d.nome || "").trim();
    const rip = (d.ripTarget || "").trim();
    if (nome) ex.nome = nome.slice(0,60);
    if (rip) ex.ripTarget = rip.slice(0,12);
    ex.serieTarget = parseInt(d.serieTarget,10) || ex.serieTarget;
    ex.note = (d.note || "").trim().slice(0,120);
    const mov = movimentiExtraDi(form);
    applicaSuperset(ex, mov.nomi, mov.rip);

    ui.editEx.delete(exId);
    persistDay(day);
  }

  document.addEventListener("input", (e) => {

  document.addEventListener("submit", (e) => {

    if (formType === "importa-testo"){

      if (link && testo.replace(link[0], "").trim().length < 20){
        ui.messaggioImport = "Il link di Canva non può essere letto dall'app: apri la scheda su Canva, seleziona la tabella, copiala e incollala qui.";

    } else if (formType === "nuova-scheda"){
      const nuova = { id: uid("sc"), nome: data.nome.trim().slice(0,60), creata: todayISO(), giorni: [] };
      state.schede.push(nuova);
      ui.nuovaSchedaAperta = false;
      ui.schedaAperta = nuova.id;          // si entra subito nella scheda appena creata
      saveLocal();
      if (dbReady && db) db.doc("schede/" + nuova.id).set(nuova).catch(()=>{});
      render();
    } else if (formType === "rename-day"){
      const dayId = form.getAttribute("data-day");

  });

  // ---- boot ----
  function boot(){
    applicaTema(localStorage.getItem(CHIAVE_TEMA) || "auto");
    state = migra(loadLocal()) || defaultState();
    if (!loadLocal()) saveLocal();
    render();
    connectDb();
    recuperaImmaginiMancanti();
