  function connectDb(){
    if (!window.claude || typeof window.claude.use !== "function") return;
    window.claude.use("db").then(async (namespace) => {
      if (!namespace) return;
      db = namespace;
      try{
        const snap = await db.collection("schede").get();
        if (snap.empty){
          for (const sc of state.schede){
            await db.doc("schede/" + sc.id).set(sc).catch(()=>{});
          }
        } else {
          state = { schede: snap.docs.map(d => d.data()).filter(Boolean) };
          saveLocal();
          render();
        }
        dbReady = true;
        db.collection("schede").onSnapshot((qsnap) => {
          state = { schede: qsnap.docs.map(d => d.data()).filter(Boolean) };
          saveLocal();
          render();
        }, () => {});
      }catch(err){}
    }).catch(() => {});
  }

  // Gesto per tornare all'elenco: la pagina segue il dito dal bordo sinistro
  // e scivola via, come la navigazione di sistema.
  (function gestoIndietro(){
    const shell = document.querySelector(".shell");
    let x0 = null, y0 = null, trascina = false;

    function fine(annulla){
      shell.style.transition = "transform .22s cubic-bezier(.22,.9,.3,1), opacity .22s ease";
      if (annulla){
        shell.style.transform = "";
        shell.style.opacity = "";
      } else {
        shell.style.transform = "translateX(100%)";
        shell.style.opacity = "0";
        setTimeout(() => {
          salvaModificheAperte();
          ui.schedaAperta = null; ui.openEx.clear();
          render();
          shell.style.transition = "none";
          shell.style.transform = "translateX(-18%)";
          shell.style.opacity = "0";
          requestAnimationFrame(() => {
            shell.style.transition = "transform .2s ease-out, opacity .2s ease-out";
            shell.style.transform = "";
            shell.style.opacity = "";
          });
        }, 200);
      }
      setTimeout(() => { shell.style.transition = ""; }, 460);
      trascina = false; x0 = null;
    }

    document.addEventListener("touchstart", (e) => {
      if (!ui.schedaAperta || e.touches.length !== 1) { x0 = null; return; }
      x0 = e.touches[0].clientX;
      y0 = e.touches[0].clientY;
      trascina = x0 < 40;                    // parte solo dal bordo sinistro
    }, { passive:true });

    document.addEventListener("touchmove", (e) => {
      if (!trascina || x0 === null) return;
      const dx = e.touches[0].clientX - x0;
      const dy = Math.abs(e.touches[0].clientY - y0);
      if (dy > 60){ fine(true); return; }    // è uno scorrimento verticale
      if (dx > 0){
        shell.style.transition = "none";
        shell.style.transform = "translateX(" + dx + "px)";
        shell.style.opacity = String(Math.max(0.35, 1 - dx / innerWidth));
      }
    }, { passive:true });

    document.addEventListener("touchend", (e) => {
      if (!trascina || x0 === null) return;
      const dx = e.changedTouches[0].clientX - x0;
      fine(dx < innerWidth * 0.3);           // oltre un terzo dello schermo si chiude
    }, { passive:true });
  })();

  // Safari ignora user-scalable=no: gli eventi gesture sono l'unico modo di fermare il pizzico
  ["gesturestart","gesturechange","gestureend"].forEach((evt) => {
    document.addEventListener(evt, (e) => e.preventDefault(), { passive:false });
  });

  let resizeTimer = null;
  let wasNarrow = window.innerWidth <= 620;
  window.addEventListener("resize", () => {
    const narrow = window.innerWidth <= 620;
    if (narrow === wasNarrow) return;
    wasNarrow = narrow;
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(render, 150);
  });

  boot();
})();

// ---- cronometro ----
// Modulo a sé: non dipende dal render dell'app, quindi il conteggio non si azzera
// quando la scheda si ridisegna, e prosegue anche a riquadro chiuso.
(function(){
  "use strict";

  const bolla = document.getElementById("cronoBolla");
  const bollaDentro = document.getElementById("cronoBollaDentro");
  const anelloBolla = document.getElementById("cronoAnelloBolla");
  const riquadro = document.getElementById("cronoRiquadro");
  const anello = document.getElementById("cronoAnello");
  const display = document.getElementById("cronoTempo");
  const bottoneAvvia = document.getElementById("cronoAvvia");
  const quadrante = document.getElementById("cronoQuadrante");
  const ruote = document.getElementById("cronoRuote");
  const ruotaMinuti = document.getElementById("ruotaMinuti");
  const ruotaSecondi = document.getElementById("ruotaSecondi");
  const ALTEZZA_VOCE = 34;

  const ICONA = bollaDentro.innerHTML;
  const GIRO_BOLLA = 2 * Math.PI * 24;    // circonferenze degli anelli
  const GIRO_GRANDE = 2 * Math.PI * 58;

  let durata = 90000;       // recupero scelto, in millisecondi
  let restante = durata;    // quanto manca
  let partenza = 0;         // istante dell'ultimo avvio
  let inCorso = false;
  let battito = null;
  let suono = null;         // creato al primo avvio, cioè dentro un gesto dell'utente

  function mancante(){
    if (!inCorso) return restante;
    return Math.max(0, restante - (performance.now() - partenza));
  }

  function formatta(ms){
    const secondi = Math.ceil(ms / 1000);
    return Math.floor(secondi / 60) + ":" + String(secondi % 60).padStart(2, "0");
  }

  function disegnaAnello(cerchio, giro, frazione){
    cerchio.style.strokeDasharray = giro;
    cerchio.style.strokeDashoffset = giro * (1 - frazione);
  }

  function aggiorna(){
    const ms = mancante();
    const frazione = durata ? (durata - ms) / durata : 0;   // l'anello si completa col tempo
    const finito = ms <= 0 && !inCorso;

    display.textContent = formatta(ms);
    disegnaAnello(anello, GIRO_GRANDE, frazione);
    disegnaAnello(anelloBolla, GIRO_BOLLA, frazione);

    // a timer fermo e non ancora avviato l'anello sparisce: resta la sola icona
    bolla.classList.toggle("inattivo", !inCorso && ms >= durata);
    bolla.classList.toggle("in-corso", inCorso);
    bolla.classList.toggle("finito", finito && restante <= 0);
    riquadro.classList.toggle("finito", finito && restante <= 0);

    // prima di partire si vedono le ruote, una volta avviato il quadrante
    const avviato = inCorso || restante < durata;
    quadrante.hidden = !avviato;
    ruote.hidden = avviato;

    // a riquadro chiuso la bolla mostra il tempo che manca, non l'icona
    if (riquadro.hidden && (inCorso || ms < durata)){
      bollaDentro.textContent = formatta(ms);
    } else if (riquadro.hidden){
      bollaDentro.innerHTML = ICONA;
    }
  }

  function segnale(){
    try{
      suono = suono || new (window.AudioContext || window.webkitAudioContext)();
      const osc = suono.createOscillator();
      const vol = suono.createGain();
      osc.frequency.value = 880;
      vol.gain.setValueAtTime(0.0001, suono.currentTime);
      vol.gain.exponentialRampToValueAtTime(0.25, suono.currentTime + 0.02);
      vol.gain.exponentialRampToValueAtTime(0.0001, suono.currentTime + 0.5);
      osc.connect(vol); vol.connect(suono.destination);
      osc.start(); osc.stop(suono.currentTime + 0.5);
    }catch(e){}
    if (navigator.vibrate) navigator.vibrate([200, 100, 200]);
  }

  function batti(){
    if (mancante() <= 0){
      restante = 0;
      inCorso = false;
      clearInterval(battito); battito = null;
      bottoneAvvia.textContent = "Avvia";
      aggiorna();
      segnale();
      return;
    }
    aggiorna();
  }

  function avvia(){
    if (inCorso || restante <= 0) return;
    // il contesto audio va creato mentre l'utente tocca, altrimenti iOS lo blocca
    try{ suono = suono || new (window.AudioContext || window.webkitAudioContext)(); }catch(e){}
    if (suono && suono.state === "suspended") suono.resume();
    inCorso = true;
    partenza = performance.now();
    bottoneAvvia.textContent = "Pausa";
    battito = setInterval(batti, 200);
    aggiorna();
  }

  function ferma(){
    if (!inCorso) return;
    restante = mancante();
    inCorso = false;
    clearInterval(battito); battito = null;
    bottoneAvvia.textContent = "Riprendi";
    aggiorna();
  }

  function azzera(){
    ferma();
    restante = durata;
    bottoneAvvia.textContent = "Avvia";
    aggiorna();
    posizionaRuote();     // tornando alla scelta le ruote mostrano il valore corrente
  }

  // ---- ruote di selezione, in stile sveglia ----
  // La lista è ripetuta più volte: arrivati vicino ai bordi si salta senza animazione
  // alla copia centrale, così scorrendo oltre 55 si riparte da 00 senza accorgersene.
  const COPIE = 7;
  const MINUTI = Array.from({length:11}, (_,i) => i);        // 0-10 minuti
  const SECONDI = Array.from({length:12}, (_,i) => i * 5);   // 0-55, a passi di 5

  function costruisciRuota(elemento, valori){
    let voci = "";
    for (let c = 0; c < COPIE; c++)
      for (const v of valori) voci += `<div class="ruota-voce">${String(v).padStart(2,"0")}</div>`;
    elemento.innerHTML = `<div class="ruota-lista">${voci}</div>`;
  }
  costruisciRuota(ruotaMinuti, MINUTI);
  costruisciRuota(ruotaSecondi, SECONDI);

  function indiceGrezzo(ruota){
    return Math.round(ruota.scrollTop / ALTEZZA_VOCE);
  }
  function valoreDi(ruota, valori){
    return valori[((indiceGrezzo(ruota) % valori.length) + valori.length) % valori.length];
  }

  function evidenzia(ruota){
    const i = indiceGrezzo(ruota);
    [...ruota.querySelectorAll(".ruota-voce")].forEach((v, k) =>
      v.classList.toggle("scelta", k === i));
  }

  function ricentra(ruota, valori){
    const copia = valori.length * ALTEZZA_VOCE;
    const basso = copia * 2, alto = copia * (COPIE - 3);
    // il salto è di copie intere: il numero sotto la banda non cambia, si sposta solo la lista
    if (ruota.scrollTop < basso) ruota.scrollTop += copia * 3;
    else if (ruota.scrollTop > alto) ruota.scrollTop -= copia * 3;
  }

  function leggiRuote(){
    // a ruote nascoste lo scorrimento vale zero: leggerlo azzererebbe il recupero scelto
    if (ruote.hidden || inCorso) return;
    const totale = (valoreDi(ruotaMinuti, MINUTI) * 60 + valoreDi(ruotaSecondi, SECONDI)) * 1000;
    durata = totale || 5000;        // mai zero: rimarrebbe un timer che non parte
    restante = durata;
    aggiorna();
  }

  function posizionaRuota(ruota, valori, valore){
    void ruota.offsetHeight;      // forza il calcolo dell'ingombro: appena mostrata varrebbe zero
    const centro = Math.floor(COPIE / 2) * valori.length;
    const dentro = Math.max(0, valori.indexOf(valore));
    ruota.scrollTop = (centro + dentro) * ALTEZZA_VOCE;
    evidenzia(ruota);
  }

  function posizionaRuote(){
    const totaleSecondi = Math.round(durata / 1000);
    posizionaRuota(ruotaMinuti, MINUTI, Math.floor(totaleSecondi / 60));
    posizionaRuota(ruotaSecondi, SECONDI, Math.round((totaleSecondi % 60) / 5) * 5 % 60);
  }

  [[ruotaMinuti, MINUTI], [ruotaSecondi, SECONDI]].forEach(([ruota, valori]) => {
    let attesa = null;
    ruota.addEventListener("scroll", () => {
      evidenzia(ruota);
      clearTimeout(attesa);
      attesa = setTimeout(() => { ricentra(ruota, valori); leggiRuote(); }, 130);
    });
  });

  function apriRiquadro(){
    riquadro.hidden = false;
    bolla.hidden = true;
    aggiorna();
    if (!ruote.hidden) posizionaRuote();   // le ruote si posizionano solo da visibili
  }

  // Trascinamento: si può spostare dove serve, ma la posizione di partenza
  // resta quella in basso a destra ogni volta che si riapre l'app.
  (function trascina(){
    let attivo = false, spostato = false, dx = 0, dy = 0;

    bolla.addEventListener("pointerdown", (e) => {
      attivo = true; spostato = false;
      const r = bolla.getBoundingClientRect();
      dx = e.clientX - r.left; dy = e.clientY - r.top;
      bolla.setPointerCapture(e.pointerId);
    });

    bolla.addEventListener("pointermove", (e) => {
      if (!attivo) return;
      if (Math.abs(e.movementX) + Math.abs(e.movementY) > 0) spostato = true;
      const x = Math.min(Math.max(e.clientX - dx, 6), innerWidth - bolla.offsetWidth - 6);
      const y = Math.min(Math.max(e.clientY - dy, 6), innerHeight - bolla.offsetHeight - 6);
      bolla.style.left = x + "px";
      bolla.style.top = y + "px";
      bolla.style.right = "auto";
      bolla.style.bottom = "auto";
    });

    bolla.addEventListener("pointerup", (e) => {
      if (!attivo) return;
      attivo = false;
      bolla.releasePointerCapture(e.pointerId);
      if (!spostato) apriRiquadro();       // un tocco fermo resta un clic
    });
  })();

  document.getElementById("cronoChiudi").addEventListener("click", () => {
    riquadro.hidden = true;
    bolla.hidden = false;
    aggiorna();
  });

  bottoneAvvia.addEventListener("click", () => { inCorso ? ferma() : avvia(); });
  document.getElementById("cronoAzzera").addEventListener("click", azzera);

  // rientrando nell'app dopo averla lasciata in secondo piano il tempo è comunque giusto,
  // perché si calcola dagli istanti e non dai battiti persi
  document.addEventListener("visibilitychange", () => { if (!document.hidden) batti(); });

  durata = 90000; restante = durata;
  aggiorna();
})();
</script>

  if ("serviceWorker" in navigator){
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(() => {});
    });
  }
</script>
